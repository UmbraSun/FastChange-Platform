services:

  postgres:
    image: postgres:16
    container_name: fastchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: FastChange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  mongo:
    image: mongo:8
    container_name: fastchange-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: FastChange
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


  redis:
    image: redis:7
    container_name: fastchange-redis
    restart: unless-stopped
    ports:
      - "6379:6379"


  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: fastchange-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"


  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: fastchange-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  qdrant:
    image: qdrant/qdrant
    container_name: fastchange-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage


  api:
    build:
      context: .
      dockerfile: Core/Dockerfile

    container_name: fastchange-api

    depends_on:
      - postgres
      - mongo
      - redis
      - kafka
      - qdrant

    ports:
      - "8080:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=FastChange;Username=postgres;Password=postgres

      Mongo__ConnectionStrings: mongodb://root:root@mongo:27017

      Mongo__DatabaseName: FastChange

      Redis__ConnectionString: redis:6379

      Kafka__BootstrapServers: kafka:29092

      Qdrant__Host: qdrant

      Qdrant__Port: 6333


volumes:

  postgres_data:

  mongo_data:

  qdrant_data: